<div class="activation-container">
  @if (loading()) {
  <p>{{ 'activation.activating' | translate }}</p>
  } @if (!loading()) { @if (success()) {
  <p>{{ 'activation.success' | translate }}</p>
  } @else {
  <p>{{ 'activation.error' | translate }}</p>
  } }
  <button type="button" class="btn btn-primary" [routerLink]="'/login'">
    {{ 'activation.go-login' | translate }}
  </button>
</div>
