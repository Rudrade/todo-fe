<div class="sidebar-background" (click)="onClose()">
  <div class="sidebar" (click)="$event.stopPropagation()">
    <h2 class="mb-3">{{ 'task.task' | translate }}</h2>
    <form (ngSubmit)="onSubmit()" [formGroup]="form">
      <div class="form-floating mb-3">
        <input
          type="text"
          class="form-control"
          placeholder="{{ 'task.title' | translate }}"
          formControlName="title"
        />
        <label for="input-title">{{ 'task.title' | translate }} *</label>
        @if (title?.invalid && title?.dirty) {
        <small>{{ 'task.title-required' | translate }}</small>
        }
      </div>
      <div class="form-floating mb-3">
        <textarea
          class="form-control"
          placeholder="{{ 'task.description' | translate }}"
          id="input-description"
          style="height: 100px"
          formControlName="description"
        ></textarea>
        <label for="input-description">{{ 'task.description' | translate }}</label>
      </div>
      <div class="form-floating mb-3">
        <input
          type="date"
          class="form-control"
          id="input-dueDate"
          placeholder="{{ 'task.due-date' | translate }}"
          formControlName="dueDate"
        />
        <label for="input-dueDate">{{ 'task.due-date' | translate }}</label>
      </div>

      <div class="form-floating mb-3">
        <div>
          <label for="input-list">{{ 'task.list' | translate }}</label>
          <app-search-select
            id="input-list"
            [options]="userListOptions"
            [selected]="selectedList"
            [hasColor]="true"
            (selectOption)="selectList($event)"
            (createOption)="createList($event)"
          />
        </div>
      </div>

      <div class="form-floating mb-3">
        <div>
          <label for="input-tags">{{ 'task.tags' | translate }}</label>
          <div>
            @for (tag of selectedTags(); track $index) {
            <app-tag [data]="tag" [removable]="true" (remove)="removeTag($event)" />
            }
          </div>
          <app-search-select
            id="input-tags"
            [options]="userTagOptions"
            [multiple]="true"
            [selected]="selectedOptions()"
            (selectOption)="selectTag($event)"
            (createOption)="createTag($event)"
          />
        </div>
      </div>

      <div class="d-flex mt-5">
        @if (data()?.id) {
        <button type="submit" class="btn btn-warning">
          {{ 'task.save-changes' | translate }}
        </button>
        } @else {
        <button type="submit" class="btn btn-primary">{{ 'task.create' | translate }}</button>
        }
        <button type="button" class="btn btn-secondary ms-auto" (click)="onClose()">
          {{ 'task.close' | translate }}
        </button>
      </div>
    </form>
  </div>
</div>
