<div class="login-card">
  <div class="d-flex flex-row" style="align-items: center">
    <h2>{{ 'login.login' | translate }}</h2>
    <img src="logo.png" class="ms-5 mb-3" alt="" />
  </div>
  <p class="text-muted">{{ 'login.description' | translate }}</p>

  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="mt-3">
    <div class="mb-3">
      <label class="form-label" for="username">{{ 'app.username' | translate }}</label>
      <input id="username" type="text" class="form-control" formControlName="username" />
    </div>

    <div class="mb-3">
      <label class="form-label" for="password">{{ 'app.password' | translate }}</label>
      <input id="password" type="password" class="form-control" formControlName="password" />
    </div>

    <div class="d-flex justify-content-between">
      <button class="btn btn-primary" type="submit" [disabled]="submitting() || !form.valid">
        {{ 'login.login' | translate }}
      </button>
      <button
        class="btn btn-link ms-2"
        type="button"
        [routerLink]="'/register'"
        [disabled]="submitting()"
      >
        {{ 'login.register' | translate }}
      </button>
      <button class="btn btn-link" type="button" [routerLink]="'/reset'" [disabled]="submitting()">
        {{ 'login.reset-password' | translate }}
      </button>
    </div>
  </form>

  @if (error() && !submitting()) {
  <small style="color: red">{{ 'login.invalid' | translate }}</small>
  } @if(submitting()) {
  <div class="d-flex justify-content-center">
    <div class="spinner-border" output="status"></div>
  </div>
  }
</div>

<div class="alerts">
  @for (alert of alerts(); track alert.id) {
  <app-alert [data]="alert" />
  }
</div>
