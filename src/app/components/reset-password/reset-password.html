<div class="center-card">
  <div class="d-flex flex-row" style="align-items: center">
    <h2>{{ 'reset.title' | translate }}</h2>
    <img src="logo.png" class="ms-5 mb-3" alt="" />
  </div>
  <p class="text-muted">{{ 'reset.description' | translate }}</p>

  <form [formGroup]="form" (ngSubmit)="onSubmit()">
    <div class="mb-3">
      <label class="form-label" for="reset-username">{{ 'reset.username' | translate }}</label>
      <input
        id="reset-username"
        type="text"
        class="form-control"
        formControlName="username"
        autocomplete="off"
      />
    </div>
    <div class="mb-3">
      <label class="form-label" for="reset-email">{{ 'reset.email' | translate }}</label>
      <input
        id="reset-email"
        type="text"
        class="form-control"
        formControlName="email"
        autocomplete="off"
      />
      @if (form.controls.email.dirty && form.controls.email.hasError('email')) {
      <small class="text-danger">{{ 'reset.email-invalid' | translate }}</small>
      }
    </div>

    <div class="d-flex justify-content-between mb-3">
      <button type="submit" class="btn btn-primary" [disabled]="form.invalid || submitting()">
        {{ 'reset.reset' | translate }}
      </button>
      <button type="button" class="btn btn-link" [routerLink]="'/'" [disabled]="submitting()">
        {{ 'reset.back-home' | translate }}
      </button>
    </div>
    @if (submitting()) {
    <div class="spinner-border" style="scale: 0.5"></div>
    } @else if (message()) {
    <small [class]="messageClass">{{ message() }}</small>
    }
  </form>
</div>
